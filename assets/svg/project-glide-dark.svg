<svg xmlns="http://www.w3.org/2000/svg" width="432" height="258" viewBox="0 0 432 258" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes haloPulse { 0%, 100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.8); opacity: 0.15; } }
    .halo { transform-box: fill-box; transform-origin: center; animation: haloPulse 2.4s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="pg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="pg-glow" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pg-clip">
      <rect x="0.5" y="0.5" width="431" height="257" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#pg-clip)">
    <rect width="432" height="258" rx="16" fill="url(#pg-bg)"/>
    <rect width="432" height="258" fill="url(#pg-glow)"/>
    <rect x="24" y="22" width="168" height="24" rx="12" fill="#1e1e24" stroke="#3d3d47" stroke-width="1"/>
    <text x="108" y="38" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#22d3ee" letter-spacing="0.9">01 · WINDOWS DESKTOP</text>

    <circle class="halo" cx="388" cy="34" r="6" fill="#22d3ee"/>
    <circle cx="388" cy="34" r="3.5" fill="#22d3ee"/>

    <text x="24" y="88" class="sans" font-size="28" font-weight="800" fill="#f2f2f5" letter-spacing="-0.6">Glide</text>
    <text x="24" y="114" class="sans" font-size="13.5" font-weight="600" fill="#6366f1">Modern v2rayN Client · Xray / sing-box</text>

    <text x="24" y="146" class="sans" font-size="13" fill="#9ca3af">Redesigned Avalonia UI with verified real</text>
    <text x="24" y="165" class="sans" font-size="13" fill="#9ca3af">traffic checks, Persian RTL &amp; GPG releases.</text>

    <rect x="24" y="184" width="54" height="22" rx="6" fill="#1e1e24" stroke="#2c2c33"/>
    <text x="51" y="199" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#f2f2f5">C# 12</text>
    <rect x="86" y="184" width="76" height="22" rx="6" fill="#1e1e24" stroke="#2c2c33"/>
    <text x="124" y="199" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#f2f2f5">Avalonia</text>
    <rect x="170" y="184" width="84" height="22" rx="6" fill="#1e1e24" stroke="#2c2c33"/>
    <text x="212" y="199" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#f2f2f5">RTL + GPG</text>

    <line x1="24" y1="220" x2="408" y2="220" stroke="#2c2c33"/>
    <circle cx="30" cy="239" r="4" fill="#6366f1"/>
    <text x="41" y="243" class="mono" font-size="11.5" font-weight="600" fill="#9ca3af">C#  ·  GPL-3.0  ·  Windows 10/11</text>
    <text x="408" y="243" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#22d3ee">Repository ↗</text>
  </g>
  <rect x="0.5" y="0.5" width="431" height="257" rx="16" stroke="#2c2c33" stroke-width="1"/>
</svg>
