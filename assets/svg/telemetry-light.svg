<svg xmlns="http://www.w3.org/2000/svg" width="880" height="222" viewBox="0 0 880 222" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .bar-anim { transform-box: fill-box; transform-origin: left center; animation: barGrow 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .scan-dot { animation: blink 1.8s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="tel-bg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f8"/>
    </linearGradient>
    <pattern id="tel-dots-l" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(15,23,42,0.045)"/>
    </pattern>
    <clipPath id="tel-clip-l">
      <rect x="0.5" y="0.5" width="879" height="221" rx="16"/>
    </clipPath>
    <clipPath id="tel-bar-clip-l">
      <rect x="36" y="162" width="808" height="10" rx="5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tel-clip-l)">
    <rect width="880" height="222" rx="16" fill="url(#tel-bg-l)"/>
    <rect width="880" height="222" fill="url(#tel-dots-l)"/>

    <text x="36" y="34" class="mono" font-size="11" font-weight="700" fill="#d62814" letter-spacing="1.4">01 // GITHUB TELEMETRY</text>
    <circle class="scan-dot" cx="708" cy="30" r="3.5" fill="#0891b2"/>
    <text x="720" y="34" class="mono" font-size="11" font-weight="600" fill="#4b5563" letter-spacing="0.9">LIVE SIGNAL · @BlackkCore</text>

    <rect x="36" y="52" width="190" height="82" rx="10" fill="#ffffff" stroke="#dfe3ec" stroke-width="1"/>
    <circle cx="52" cy="70" r="3" fill="#d62814"/>
    <text x="62" y="73" class="mono" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="1">PUBLIC REPOS</text>
    <text x="52" y="103" class="sans" font-size="24" font-weight="800" fill="#111318" letter-spacing="-0.5">03</text>
    <text x="52" y="122" class="sans" font-size="11.5" font-weight="500" fill="#4b5563">Glide · Trace · Profile</text>

    <rect x="242" y="52" width="190" height="82" rx="10" fill="#ffffff" stroke="#dfe3ec" stroke-width="1"/>
    <circle cx="258" cy="70" r="3" fill="#0891b2"/>
    <text x="268" y="73" class="mono" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="1">YEARLY COMMITS</text>
    <text x="258" y="103" class="sans" font-size="24" font-weight="800" fill="#111318" letter-spacing="-0.5">35+</text>
    <text x="258" y="122" class="sans" font-size="11.5" font-weight="500" fill="#4b5563">Active shipping cadence</text>

    <rect x="448" y="52" width="190" height="82" rx="10" fill="#ffffff" stroke="#dfe3ec" stroke-width="1"/>
    <circle cx="464" cy="70" r="3" fill="#b47b19"/>
    <text x="474" y="73" class="mono" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="1">PROJECTS</text>
    <text x="464" y="103" class="sans" font-size="24" font-weight="800" fill="#111318" letter-spacing="-0.5">03</text>
    <text x="464" y="122" class="sans" font-size="11.5" font-weight="500" fill="#4b5563">Glide · Trace · SinaFit</text>

    <rect x="654" y="52" width="190" height="82" rx="10" fill="#ffffff" stroke="#dfe3ec" stroke-width="1"/>
    <circle cx="670" cy="70" r="3" fill="#4350f2"/>
    <text x="680" y="73" class="mono" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="1">PRIMARY STACK</text>
    <text x="670" y="103" class="sans" font-size="24" font-weight="800" fill="#111318" letter-spacing="-0.5">C# · JS</text>
    <text x="670" y="122" class="sans" font-size="11.5" font-weight="500" fill="#4b5563">Avalonia &amp; Edge Web</text>

    <text x="36" y="152" class="mono" font-size="10.5" font-weight="700" fill="#4b5563" letter-spacing="1">CODEBASE DISTRIBUTION</text>
    <g class="bar-anim" clip-path="url(#tel-bar-clip-l)">
      <rect x="36" y="162" width="549" height="10" fill="#4350f2"/>
      <rect x="585" y="162" width="194" height="10" fill="#0891b2"/>
      <rect x="779" y="162" width="65" height="10" fill="#d62814"/>
    </g>

    <circle cx="41" cy="193" r="4" fill="#4350f2"/>
    <text x="52" y="197" class="sans" font-size="12" font-weight="700" fill="#111318">C# / .NET <tspan fill="#4b5563" font-weight="500">68%</tspan></text>
    <circle cx="216" cy="193" r="4" fill="#0891b2"/>
    <text x="227" y="197" class="sans" font-size="12" font-weight="700" fill="#111318">JavaScript <tspan fill="#4b5563" font-weight="500">24%</tspan></text>
    <circle cx="391" cy="193" r="4" fill="#d62814"/>
    <text x="402" y="197" class="sans" font-size="12" font-weight="700" fill="#111318">HTML / CSS <tspan fill="#4b5563" font-weight="500">8%</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="221" rx="16" stroke="#dfe3ec" stroke-width="1"/>
</svg>
