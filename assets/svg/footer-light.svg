<svg xmlns="http://www.w3.org/2000/svg" width="880" height="134" viewBox="0 0 880 134" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes ember { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .ember { animation: ember 2s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="ft-bg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f8"/>
    </linearGradient>
    <pattern id="ft-dots-l" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(15,23,42,0.045)"/>
    </pattern>
    <clipPath id="ft-clip-l">
      <rect x="0.5" y="0.5" width="879" height="133" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ft-clip-l)">
    <rect width="880" height="134" rx="16" fill="url(#ft-bg-l)"/>
    <rect width="880" height="134" fill="url(#ft-dots-l)"/>
    <text x="36" y="54" class="sans" font-size="26" font-weight="800" fill="#111318" letter-spacing="-0.6">Let’s make it <tspan fill="#d62814">real.</tspan></text>
    <text x="36" y="80" class="sans" font-size="13.5" fill="#4b5563">Interested in my work, want to collaborate, or have an idea worth shipping?</text>
    <text x="36" y="108" class="mono" font-size="11" fill="#6b7280">Designed and built with care · Zekky / BlackCore</text>

    <rect x="650" y="44" width="194" height="44" rx="22" fill="#d62814"/>
    <circle class="ember" cx="674" cy="66" r="4" fill="#ffffff"/>
    <text x="754" y="71" text-anchor="middle" class="sans" font-size="13.5" font-weight="700" fill="#ffffff">Explore Portfolio ↗</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="133" rx="16" stroke="#dfe3ec" stroke-width="1"/>
</svg>
