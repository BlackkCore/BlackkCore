<svg xmlns="http://www.w3.org/2000/svg" width="880" height="184" viewBox="0 0 880 184" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes drawWave {
      0% { stroke-dashoffset: 320; }
      100% { stroke-dashoffset: 0; }
    }
    .wave { stroke-dasharray: 320; animation: drawWave 2.8s ease-out infinite alternate; }
  </style>
  <defs>
    <linearGradient id="ps-bg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f8"/>
    </linearGradient>
    <radialGradient id="ps-glow-l" cx="90%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#b47b19" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#b47b19" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ps-clip-l">
      <rect x="0.5" y="0.5" width="879" height="183" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ps-clip-l)">
    <rect width="880" height="184" rx="16" fill="url(#ps-bg-l)"/>
    <rect width="880" height="184" fill="url(#ps-glow-l)"/>

    <rect x="32" y="22" width="198" height="24" rx="12" fill="#f1f3f7" stroke="#c9d0df"/>
    <text x="131" y="38" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#b47b19" letter-spacing="0.9">03 · FULL-STACK PLATFORM</text>

    <text x="32" y="78" class="sans" font-size="24" font-weight="800" fill="#111318" letter-spacing="-0.5">SinaFit — Fitness Coaching Platform</text>
    <text x="32" y="103" class="sans" font-size="13.5" fill="#4b5563">Personalized workout &amp; nutrition planning, coach and client</text>
    <text x="32" y="122" class="sans" font-size="13.5" fill="#4b5563">dashboards, and real-time progress tracking in a mobile PWA.</text>

    <rect x="614" y="24" width="234" height="96" rx="12" fill="#ffffff" stroke="#dfe3ec"/>
    <text x="630" y="45" class="mono" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.9">PROGRESS TELEMETRY</text>
    <path d="M 632 98 L 664 87 L 696 92 L 732 71 L 768 77 L 802 55 L 830 49" stroke="#c9d0df" stroke-width="2" stroke-linecap="round"/>
    <path class="wave" d="M 632 98 L 664 87 L 696 92 L 732 71 L 768 77 L 802 55 L 830 49" stroke="#b47b19" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="830" cy="49" r="4" fill="#d62814"/>

    <line x1="32" y1="142" x2="848" y2="142" stroke="#dfe3ec"/>
    <text x="32" y="165" class="mono" font-size="11.5" font-weight="600" fill="#4b5563">Full-Stack  ·  UI/UX  ·  PWA  ·  Performance &amp; Security</text>
    <text x="848" y="165" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#b47b19">Visit sinafitt.com ↗</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="183" rx="16" stroke="#dfe3ec" stroke-width="1"/>
