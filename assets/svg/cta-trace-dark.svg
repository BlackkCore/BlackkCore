<svg xmlns="http://www.w3.org/2000/svg" width="155" height="42" viewBox="0 0 155 42" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @keyframes dotBeat { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .beat { animation: dotBeat 2s ease-in-out infinite; }
  </style>
  <rect x="0.5" y="0.5" width="154" height="41" rx="20.5" fill="#1e1e24" stroke="#3d3d47" stroke-width="1"/>
  <circle class="beat" cx="22" cy="21" r="3.5" fill="#22d3ee"/>
  <text x="83.5" y="25.5" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#f2f2f5" letter-spacing="0.2">Trace Studio</text>
</svg>
