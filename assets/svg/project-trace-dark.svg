<svg xmlns="http://www.w3.org/2000/svg" width="432" height="258" viewBox="0 0 432 258" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes eqA { 0%, 100% { transform: scaleY(0.55); } 50% { transform: scaleY(1); } }
    @keyframes eqB { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.42); } }
    @keyframes eqC { 0%, 100% { transform: scaleY(0.7); } 50% { transform: scaleY(1.05); } }
    .b1 { transform-box: fill-box; transform-origin: bottom center; animation: eqA 1.4s ease-in-out infinite; }
    .b2 { transform-box: fill-box; transform-origin: bottom center; animation: eqB 1.7s ease-in-out infinite; }
    .b3 { transform-box: fill-box; transform-origin: bottom center; animation: eqC 1.2s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="pt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="pt-glow" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pt-clip">
      <rect x="0.5" y="0.5" width="431" height="257" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#pt-clip)">
    <rect width="432" height="258" rx="16" fill="url(#pt-bg)"/>
    <rect width="432" height="258" fill="url(#pt-glow)"/>
    <rect x="24" y="22" width="168" height="24" rx="12" fill="#1e1e24" stroke="#3d3d47" stroke-width="1"/>
    <text x="108" y="38" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#22d3ee" letter-spacing="0.9">02 · BROWSER STUDIO</text>

    <rect class="b1" x="378" y="25" width="4" height="17" rx="2" fill="#22d3ee"/>
    <rect class="b2" x="386" y="24" width="4" height="18" rx="2" fill="#e3321b"/>
    <rect class="b3" x="394" y="26" width="4" height="16" rx="2" fill="#22d3ee"/>

    <text x="24" y="88" class="sans" font-size="28" font-weight="800" fill="#f2f2f5" letter-spacing="-0.6">Trace</text>
    <text x="24" y="114" class="sans" font-size="13.5" font-weight="600" fill="#22d3ee">Client-Side VLESS Configuration Suite</text>

    <text x="24" y="146" class="sans" font-size="13" fill="#9ca3af">Generate, parse, validate, convert, and run</text>
    <text x="24" y="165" class="sans" font-size="13" fill="#9ca3af">TCPing checks locally with zero backend.</text>

    <rect x="24" y="184" width="94" height="22" rx="6" fill="#1e1e24" stroke="#2c2c33"/>
    <text x="71" y="199" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#f2f2f5">JavaScript</text>
    <rect x="126" y="184" width="70" height="22" rx="6" fill="#1e1e24" stroke="#2c2c33"/>
    <text x="161" y="199" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#f2f2f5">TCPing</text>
    <rect x="204" y="184" width="96" height="22" rx="6" fill="#1e1e24" stroke="#2c2c33"/>
    <text x="252" y="199" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#f2f2f5">Zero Backend</text>

    <line x1="24" y1="220" x2="408" y2="220" stroke="#2c2c33"/>
    <circle cx="30" cy="239" r="4" fill="#f7df1e"/>
    <text x="41" y="243" class="mono" font-size="11.5" font-weight="600" fill="#9ca3af">JS  ·  2 ★  ·  Privacy-First</text>
    <text x="408" y="243" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#22d3ee">Live Demo ↗</text>
  </g>
  <rect x="0.5" y="0.5" width="431" height="257" rx="16" stroke="#2c2c33" stroke-width="1"/>
</svg>
