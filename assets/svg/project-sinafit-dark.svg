<svg xmlns="http://www.w3.org/2000/svg" width="880" height="184" viewBox="0 0 880 184" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes drawWave {
      0% { stroke-dashoffset: 320; }
      100% { stroke-dashoffset: 0; }
    }
    .wave { stroke-dasharray: 320; animation: drawWave 2.8s ease-out infinite alternate; }
  </style>
  <defs>
    <linearGradient id="ps-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="ps-glow" cx="90%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#e2b25a" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#e2b25a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ps-clip">
      <rect x="0.5" y="0.5" width="879" height="183" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ps-clip)">
    <rect width="880" height="184" rx="16" fill="url(#ps-bg)"/>
    <rect width="880" height="184" fill="url(#ps-glow)"/>

    <rect x="32" y="22" width="198" height="24" rx="12" fill="#1e1e24" stroke="#3d3d47"/>
    <text x="131" y="38" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#e2b25a" letter-spacing="0.9">03 · FULL-STACK PLATFORM</text>

    <text x="32" y="78" class="sans" font-size="24" font-weight="800" fill="#f2f2f5" letter-spacing="-0.5">SinaFit — Fitness Coaching Platform</text>
    <text x="32" y="103" class="sans" font-size="13.5" fill="#9ca3af">Personalized workout &amp; nutrition planning, coach and client</text>
    <text x="32" y="122" class="sans" font-size="13.5" fill="#9ca3af">dashboards, and real-time progress tracking in a mobile PWA.</text>

    <rect x="614" y="24" width="234" height="96" rx="12" fill="#16161a" stroke="#2c2c33"/>
    <text x="630" y="45" class="mono" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.9">PROGRESS TELEMETRY</text>
    <path d="M 632 98 L 664 87 L 696 92 L 732 71 L 768 77 L 802 55 L 830 49" stroke="#3d3d47" stroke-width="2" stroke-linecap="round"/>
    <path class="wave" d="M 632 98 L 664 87 L 696 92 L 732 71 L 768 77 L 802 55 L 830 49" stroke="#e2b25a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="830" cy="49" r="4" fill="#e3321b"/>

    <line x1="32" y1="142" x2="848" y2="142" stroke="#2c2c33"/>
    <text x="32" y="165" class="mono" font-size="11.5" font-weight="600" fill="#9ca3af">Full-Stack  ·  UI/UX  ·  PWA  ·  Performance &amp; Security</text>
    <text x="848" y="165" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#e2b25a">Visit sinafitt.com ↗</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="183" rx="16" stroke="#2c2c33" stroke-width="1"/>
</svg>
