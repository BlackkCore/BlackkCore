<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.82); }
    }
    @keyframes packetRun {
      0% { transform: translateX(-180px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(880px); opacity: 0; }
    }
    @keyframes floatFacet {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes shimmerSweep {
      0% { stroke-dashoffset: 260; }
      100% { stroke-dashoffset: 0; }
    }
    .dot-pulse { transform-box: fill-box; transform-origin: center; animation: pulseDot 2.1s ease-in-out infinite; }
    .signal-packet { animation: packetRun 4.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .facet-mark { animation: floatFacet 5.2s ease-in-out infinite; }
    .circuit-line { stroke-dasharray: 260; animation: shimmerSweep 3.2s ease-out forwards; }
  </style>
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="hero-steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ededf0"/>
      <stop offset="55%" stop-color="#b9bbc4"/>
      <stop offset="100%" stop-color="#ededf0"/>
    </linearGradient>
    <linearGradient id="hero-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3321b" stop-opacity="0"/>
      <stop offset="45%" stop-color="#e3321b" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hero-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.045)"/>
    </pattern>
    <clipPath id="hero-clip">
      <rect x="0.5" y="0.5" width="879" height="309" rx="16"/>
    </clipPath>
    <radialGradient id="hero-glow-a" cx="85%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#e3321b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e3321b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-b" cx="15%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="z-facet-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f4f6"/>
      <stop offset="100%" stop-color="#8b8e99"/>
    </linearGradient>
    <linearGradient id="z-facet-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#525561"/>
      <stop offset="100%" stop-color="#22232a"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="880" height="310" rx="16" fill="url(#hero-bg)"/>
    <rect width="880" height="310" fill="url(#hero-dots)"/>
    <rect width="880" height="310" fill="url(#hero-glow-a)"/>
    <rect width="880" height="310" fill="url(#hero-glow-b)"/>

    <path class="circuit-line" d="M 620 0 L 620 74 L 664 118 L 880 118" stroke="#3d3d47" stroke-width="1" opacity="0.6"/>
    <path class="circuit-line" d="M 740 310 L 740 225 L 786 180 L 880 180" stroke="#e3321b" stroke-width="1" opacity="0.35"/>

    <g transform="translate(36, 28)">
      <g class="facet-mark">
        <rect x="0" y="0" width="36" height="36" rx="8" fill="#1e1e24" stroke="#3d3d47" stroke-width="1"/>
        <polygon points="8,9 28,9 28,14 15,27 8,27 20,14 8,14" fill="url(#z-facet-1)"/>
        <polygon points="15,27 28,22 28,27" fill="#e3321b"/>
        <polygon points="8,14 16,14 11,19" fill="url(#z-facet-2)"/>
      </g>
      <text x="50" y="17" class="sans" font-size="16" font-weight="800" fill="#f2f2f5" letter-spacing="1.8">ZEKKY<tspan fill="#e3321b">.</tspan></text>
      <text x="50" y="33" class="mono" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1.4">BLACKKCORE // SYSTEMS &amp; INTERFACES</text>
    </g>

    <g>
      <rect x="664" y="28" width="180" height="32" rx="16" fill="#1e1e24" stroke="#3d3d47" stroke-width="1"/>
      <circle class="dot-pulse" cx="682" cy="44" r="4.5" fill="#e3321b"/>
      <text x="696" y="48" class="mono" font-size="11" font-weight="700" fill="#f2f2f5" letter-spacing="0.9">SHIPPING IN PUBLIC</text>
    </g>

    <text x="36" y="128" class="sans" font-size="40" font-weight="800" fill="#f2f2f5" letter-spacing="-1">Building software that</text>
    <text x="36" y="176" class="sans" font-size="40" font-weight="800" fill="url(#hero-steel)" letter-spacing="-1">feels as good as it <tspan fill="#e3321b">works.</tspan></text>

    <text x="36" y="216" class="sans" font-size="15.5" font-weight="500" fill="#9ca3af">Full-Stack Developer · Web · Desktop · Systems  —  Creator of Glide, Trace &amp; SinaFit.</text>

    <line x1="0" y1="252" x2="880" y2="252" stroke="#2c2c33" stroke-width="1"/>
    <rect class="signal-packet" x="0" y="251" width="180" height="2" fill="url(#hero-beam)"/>

    <text x="36" y="284" class="mono" font-size="11.5" font-weight="600" fill="#6b7280" letter-spacing="0.8">
      <tspan fill="#e3321b">01</tspan> GLIDE (C# / AVALONIA)   ·   <tspan fill="#22d3ee">02</tspan> TRACE (CLIENT VLESS)   ·   <tspan fill="#e2b25a">03</tspan> SINAFIT (PWA)
    </text>
    <text x="844" y="284" text-anchor="end" class="mono" font-size="11.5" font-weight="600" fill="#9ca3af">zekky.pages.dev ↗</text>
  </g>

  <rect x="0.5" y="0.5" width="879" height="309" rx="16" stroke="#2c2c33" stroke-width="1"/>
</svg>
