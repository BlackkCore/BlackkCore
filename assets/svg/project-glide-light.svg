<svg xmlns="http://www.w3.org/2000/svg" width="432" height="258" viewBox="0 0 432 258" fill="none">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes haloPulse { 0%, 100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.8); opacity: 0.15; } }
    .halo { transform-box: fill-box; transform-origin: center; animation: haloPulse 2.4s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="pg-bg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f8"/>
    </linearGradient>
    <radialGradient id="pg-glow-l" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#4350f2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4350f2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pg-clip-l">
      <rect x="0.5" y="0.5" width="431" height="257" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#pg-clip-l)">
    <rect width="432" height="258" rx="16" fill="url(#pg-bg-l)"/>
    <rect width="432" height="258" fill="url(#pg-glow-l)"/>
    <rect x="24" y="22" width="168" height="24" rx="12" fill="#f1f3f7" stroke="#c9d0df" stroke-width="1"/>
    <text x="108" y="38" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#0891b2" letter-spacing="0.9">01 · WINDOWS DESKTOP</text>

    <circle class="halo" cx="388" cy="34" r="6" fill="#0891b2"/>
    <circle cx="388" cy="34" r="3.5" fill="#0891b2"/>

    <text x="24" y="88" class="sans" font-size="28" font-weight="800" fill="#111318" letter-spacing="-0.6">Glide</text>
    <text x="24" y="114" class="sans" font-size="13.5" font-weight="600" fill="#4350f2">Modern v2rayN Client · Xray / sing-box</text>

    <text x="24" y="146" class="sans" font-size="13" fill="#4b5563">Redesigned Avalonia UI with verified real</text>
    <text x="24" y="165" class="sans" font-size="13" fill="#4b5563">traffic checks, Persian RTL &amp; GPG releases.</text>

    <rect x="24" y="184" width="54" height="22" rx="6" fill="#f1f3f7" stroke="#dfe3ec"/>
    <text x="51" y="199" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#111318">C# 12</text>
    <rect x="86" y="184" width="76" height="22" rx="6" fill="#f1f3f7" stroke="#dfe3ec"/>
    <text x="124" y="199" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#111318">Avalonia</text>
    <rect x="170" y="184" width="84" height="22" rx="6" fill="#f1f3f7" stroke="#dfe3ec"/>
    <text x="212" y="199" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#111318">RTL + GPG</text>

    <line x1="24" y1="220" x2="408" y2="220" stroke="#dfe3ec"/>
    <circle cx="30" cy="239" r="4" fill="#4350f2"/>
    <text x="41" y="243" class="mono" font-size="11.5" font-weight="600" fill="#4b5563">C#  ·  GPL-3.0  ·  Windows 10/11</text>
    <text x="408" y="243" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#0891b2">Repository ↗</text>
  </g>
  <rect x="0.5" y="0.5" width="431" height="257" rx="16" stroke="#dfe3ec" stroke-width="1"/>
</svg>
